name: Publish npm Packages

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Type tests
        run: pnpm test:types

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @define/core publish --access public --no-git-checks
          pnpm --filter @define/adapter-drizzle publish --access public --no-git-checks
          pnpm --filter @define/adapter-fastify publish --access public --no-git-checks
          pnpm --filter @define/adapter-openapi publish --access public --no-git-checks
          pnpm --filter @define/cli publish --access public --no-git-checks
